<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Duplicate Finder</title>
</head>
<body>
  <div id="DuplicateFinderConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
       data-require="emby-input,emby-button,emby-checkbox">
    <div data-role="content">
      <div class="content-primary" style="width:100%;max-width:none;box-sizing:border-box;padding-left:16px;padding-right:12px;">
        <h2>Settings</h2>
        <form id="DuplicateFinderConfigForm">
          <div class="inputContainer">
            <label class="inputLabel inputLabelUnfocused" for="SimilarityThreshold">Title similarity threshold (0-1)</label>
            <input is="emby-input" type="number" id="SimilarityThreshold" min="0" max="1" step="0.01" required />
          </div>
          <div class="checkboxContainer checkboxContainer-withDescription">
            <label class="emby-checkbox-label">
              <input is="emby-checkbox" type="checkbox" id="IncludeSimilarTitles" />
              <span>Report similar titles as well as exact duplicates</span>
            </label>
          </div>
          <div class="checkboxContainer checkboxContainer-withDescription">
            <label class="emby-checkbox-label">
              <input is="emby-checkbox" type="checkbox" id="PreferDubbed" />
              <span>Prefer dubbed versions (the non-dubbed copy becomes a removal candidate)</span>
            </label>
          </div>
          <div>
            <button is="emby-button" type="submit" class="raised button-submit block emby-button">
              <span>Save settings</span>
            </button>
          </div>
        </form>

        <h2>Detection</h2>
        <p style="opacity:.8">Read-only. Nothing is deleted in this version. The scan does not read file contents; use <b>Check hash</b> on a group to check its hash.</p>
        <div id="error" style="color:#ff8a80;margin:0.5em 0;"></div>
        <div id="scope" style="font-size:1.1em;margin:0.5em 0;"></div>
        <div id="cards" style="display:flex;gap:1.5em;flex-wrap:wrap;margin:1em 0;"></div>
        <h3>Skipped</h3>
        <ul id="skipped"></ul>
        <p><button is="emby-button" id="startScan" type="button" class="raised button-submit block emby-button"><span>Start detection</span></button></p>
        <div id="status" style="margin:0.5em 0;"></div>
        <div id="summary" style="margin:0.5em 0;"></div>
        <div id="results" style="width:100%;box-sizing:border-box;"></div>
      </div>
    </div>
    <script type="text/javascript">
      (function () {
        // Jellyfin's API returns PascalCase property names.
        var pluginId = 'bd622318-4e30-4155-9f90-f0cbfeeedff2';
        var page = document.querySelector('#DuplicateFinderConfigPage');
        var $ = function (id) { return document.getElementById(id); };
        var esc = function (s) {
          return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        };
        var card = function (label, value) {
          return '<div><div style="opacity:.7">' + label + '</div><div style="font-size:1.6em">' + value + '</div></div>';
        };
        var gb = function (bytes) { return (bytes / 1073741824).toFixed(2) + ' GB'; };
        var showError = function (err) {
          $('error').textContent = 'Error: ' + (err && err.message ? err.message : err);
        };

        // Pills and buttons use inline styles only. Page-level <style> blocks are not applied here.
        var pill = function (bg, text) {
          return '<span style="display:inline-block;padding:3px 12px;border-radius:999px;font-size:0.85em;font-weight:600;color:#ffffff;background:' + bg + ';">' + text + '</span>';
        };

        // Both action buttons share the same shape. Only the colors differ.
        var btnShape = 'display:block;box-sizing:border-box;width:150px;padding:9px 12px;border-radius:6px;'
          + 'font-weight:600;font-size:0.95em;text-align:center;text-decoration:none;white-space:nowrap;'
          + 'border:1px solid transparent;cursor:pointer;margin:0 auto;';
        var btnOpen = btnShape + 'background:#00a4dc;color:#ffffff;';
        var btnDelete = btnShape + 'background:#2b2b2b;color:#9e9e9e;border:1px dashed #b71c1c;cursor:not-allowed;';
        var btnVerify = 'display:inline-block;box-sizing:border-box;padding:9px 16px;border-radius:6px;'
          + 'font-weight:600;font-size:0.95em;text-decoration:none;white-space:nowrap;border:none;cursor:pointer;'
          + 'background:#6a1b9a;color:#ffffff;';
        var btnVerifying = 'display:inline-block;box-sizing:border-box;padding:9px 16px;border-radius:6px;'
          + 'font-weight:600;font-size:0.95em;white-space:nowrap;border:none;'
          + 'background:#3a3a3a;color:#bdbdbd;cursor:wait;';

        var mark = function (r) {
          if (r === 'keep') return '<span title="Keep (recommended)" style="color:#66bb6a;font-size:1.4em;font-weight:700;">&#10004;</span>';
          if (r === 'remove') return '<span title="Remove candidate" style="color:#ef5350;font-size:1.4em;font-weight:700;">&#10006;</span>';
          if (r === 'equal') return '<span title="Equal: identical copies, you choose" style="color:#42a5f5;font-size:1.4em;font-weight:700;">=</span>';
          return '<span title="Review: you decide" style="color:#ffca28;font-size:1.4em;font-weight:700;">?</span>';
        };

        var movieUrl = function (itemId) {
          var sid = (ApiClient.serverId && ApiClient.serverId()) || '';
          return ApiClient.getUrl('web/#/details?id=' + itemId + (sid ? '&serverId=' + sid : ''));
        };

        var baseStyle = 'padding:10px 12px;border-bottom:1px solid #333;vertical-align:middle;';
        var td = function (content, opts) {
          opts = opts || {};
          var style = baseStyle
            + 'text-align:' + (opts.left ? 'left' : 'center') + ';'
            + (opts.wrap ? 'white-space:normal;word-break:break-all;' : 'white-space:nowrap;');
          return '<td style="' + style + '"' + (opts.title ? ' title="' + esc(opts.title) + '"' : '') + '>' + content + '</td>';
        };
        var th = function (label, opts) {
          opts = opts || {};
          return '<th style="' + baseStyle + 'font-weight:600;white-space:nowrap;text-align:' + (opts.left ? 'left' : 'center') + ';"'
            + (opts.title ? ' title="' + esc(opts.title) + '"' : '') + '>' + label + '</th>';
        };

        var kindPill = function (g) {
          if (g.Kind === 'identical') return pill('#1565c0', 'Identical: same content, you choose which to keep');
          if (g.Kind === 'same-spec') return pill('#ef6c00', 'Same specs, different content: review');
          if (g.Kind === 'candidate') return pill('#6a1b9a', 'Same specs and size: hash not checked');
          return pill('#2e7d32', 'Different versions');
        };
        var confPill = function (g) {
          return g.Confidence === 'low' ? pill('#6d4c41', 'Title and year only') : pill('#37474f', 'Matched by TMDb ID');
        };

        var verifyControl = function (g) {
          if (g.Kind !== 'candidate') return '';
          if (g.VerifyState === 'running') {
            return '<button type="button" disabled style="' + btnVerifying + '">Verifying hash...</button>';
          }
          var note = g.VerifyState === 'failed' ? '<span style="color:#ff8a80;margin-left:10px;">Hash check failed: ' + esc(g.VerifyError) + '</span>' : '';
          return '<button type="button" data-verify="' + esc(g.Id) + '" style="' + btnVerify + '">Check hash</button>' + note;
        };

        function renderGroups(j) {
          var groups = j.Groups || [];
          var count = function (k) { return groups.filter(function (g) { return g.Kind === k; }).length; };
          var low = groups.filter(function (g) { return g.Confidence === 'low'; }).length;
          $('summary').innerHTML = '<p><b>' + groups.length + '</b> groups: '
            + pill('#1565c0', count('identical') + ' identical') + ' '
            + pill('#6a1b9a', count('candidate') + ' not verified') + ' '
            + pill('#ef6c00', count('same-spec') + ' same specs, different content') + ' '
            + pill('#2e7d32', count('version') + ' different versions') + ' '
            + pill('#6d4c41', low + ' title only') + '</p>'
            + '<p style="opacity:.75">&#10004; keep (recommended) &nbsp; &#10006; remove candidate &nbsp; '
            + '= identical copies, you choose &nbsp; ? review. Keep score: higher means better to keep. Hover a score for its breakdown.</p>';

          if (groups.length === 0) {
            $('results').innerHTML = '<p>No duplicates found.</p>';
            return;
          }

          $('results').innerHTML = groups.map(function (g) {
            var rows = g.Versions.map(function (v) {
              var actions = '<div style="display:flex;flex-direction:column;gap:8px;align-items:center;">'
                + '<button type="button" disabled title="Deletion comes in a later version" style="' + btnDelete + '">Delete (later)</button>'
                + '<a target="_blank" rel="noopener" href="' + esc(movieUrl(v.ItemId)) + '" style="' + btnOpen + '">Open movie</a>'
                + '</div>';
              return '<tr>'
                + td(mark(v.Recommendation))
                + td(esc(v.Path), { left: true, wrap: true })
                + td(gb(v.SizeBytes))
                + td(v.Height ? v.Height + 'p' : '-')
                + td(esc(v.VideoCodec || '-'))
                + td(esc(v.Source || '-'))
                + td(v.IsDubbed ? 'Yes' : 'No')
                + td((v.HasHardSub ? 'Hard' : 'Soft') + ' (' + v.SubtitleTracks + ')')
                + td('<b>' + v.Score + '</b>', { title: v.Reasons.join('; ') })
                + td(actions)
                + '</tr>';
            }).join('');

            return '<div style="margin:1.5em 0;width:100%;box-sizing:border-box;">'
              + '<div style="background:#1b1b1b;border-radius:10px;padding:14px 18px;box-sizing:border-box;">'
              + '<h3 style="margin:0 0 4px 0;">' + esc(g.Title) + (g.Year ? ' (' + g.Year + ')' : '') + '</h3>'
              + '<div style="margin:4px 0 8px 0;">' + kindPill(g) + ' ' + confPill(g) + '</div>'
              + (g.Kind === 'candidate' ? '<div style="margin:0 0 10px 0;">' + verifyControl(g) + '</div>' : '')
              + '<div style="overflow-x:auto;width:100%;box-sizing:border-box;padding-right:8px;">'
              + '<table style="border-collapse:collapse;width:100%;font-size:0.95em;">'
              + '<thead><tr>'
              + th('Keep') + th('File', { left: true }) + th('Size') + th('Resolution') + th('Codec')
              + th('Source') + th('Dubbed') + th('Subtitles')
              + th('Keep score', { title: 'Higher means better to keep' }) + th('Action')
              + '</tr></thead><tbody>' + rows + '</tbody></table></div>'
              + '</div></div>';
          }).join('');
        }

        function loadStats() {
          return ApiClient.getJSON(ApiClient.getUrl('DuplicateFinder/Stats')).then(function (s) {
            $('error').textContent = '';
            $('scope').textContent = 'Detection will run on ' + s.Eligible.toLocaleString() + ' movie files.';
            $('cards').innerHTML = card('Total movies', s.TotalMovies)
              + card('Checked by TMDb ID', s.WithTmdb)
              + card('Checked by title and year', s.WithoutTmdb)
              + card('Multi-part (kept separate)', s.MultiPart);
            var skipped = Object.keys(s.Skipped).map(function (r) { return '<li>' + r + ': ' + s.Skipped[r] + '</li>'; });
            var samples = s.SkippedSamples.map(function (p) { return '<li style="opacity:.6">' + esc(p) + '</li>'; });
            $('skipped').innerHTML = skipped.concat(samples).join('');
          }).catch(showError);
        }

        // One polling loop at a time. It stops when the scan and all hash checks are finished.
        var pollTimer = null;
        function schedulePoll() {
          if (pollTimer === null) {
            pollTimer = setTimeout(function () { pollTimer = null; poll(); }, 2000);
          }
        }

        function poll() {
          return ApiClient.getJSON(ApiClient.getUrl('DuplicateFinder/Status')).then(function (j) {
            $('status').textContent = 'Status: ' + j.State + (j.Error ? ' - ' + j.Error : '');
            var groups = j.Groups || [];
            var verifying = groups.some(function (g) { return g.VerifyState === 'running'; });
            if (j.State === 'running') { schedulePoll(); return; }
            if (j.State === 'done') { renderGroups(j); }
            if (verifying) { schedulePoll(); }
          }).catch(showError);
        }

        page.addEventListener('pageshow', function () {
          ApiClient.getPluginConfiguration(pluginId).then(function (config) {
            $('SimilarityThreshold').value = config.SimilarityThreshold;
            $('IncludeSimilarTitles').checked = config.IncludeSimilarTitles;
            $('PreferDubbed').checked = config.PreferDubbed;
          }).catch(showError);
          loadStats();
        });

        $('DuplicateFinderConfigForm').addEventListener('submit', function (e) {
          e.preventDefault();
          ApiClient.getPluginConfiguration(pluginId).then(function (config) {
            config.SimilarityThreshold = parseFloat($('SimilarityThreshold').value);
            config.IncludeSimilarTitles = $('IncludeSimilarTitles').checked;
            config.PreferDubbed = $('PreferDubbed').checked;
            return ApiClient.updatePluginConfiguration(pluginId, config);
          }).then(Dashboard.processPluginConfigurationUpdateResult).catch(showError);
        });

        $('startScan').addEventListener('click', function () {
          ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('DuplicateFinder/Start') })
            .then(poll).catch(showError);
        });

        // Verify buttons are rendered inside #results, so one listener handles them all.
        $('results').addEventListener('click', function (e) {
          var gid = e.target && e.target.getAttribute ? e.target.getAttribute('data-verify') : null;
          if (!gid) { return; }
          ApiClient.ajax({ type: 'POST', url: ApiClient.getUrl('DuplicateFinder/Verify?groupId=' + encodeURIComponent(gid)) })
            .then(poll).catch(showError);
        });
      })();
    </script>
  </div>
</body>
</html>
